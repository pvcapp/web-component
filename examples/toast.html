<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PVC Component - Toast</title>
    <link rel="stylesheet" href="root.css">
    <link rel="stylesheet" href="../src/toast/style.css">
    <style>
        body { margin: 0; padding: 30px; background: #f5f6f8; color: #212529; font-family: Arial, sans-serif; }
        main { max-width: 760px; margin: auto; }
        .panel { padding: 24px; border-radius: 12px; background: white; }
        button { padding: 9px 14px; border: 0; border-radius: 8px; background: #167a8a; color: white; cursor: pointer; font: inherit; }
        #toast-preview { display: none; cursor: pointer; }
        #toast-preview.is-visible { display: block; }
    </style>
</head>
<body>
    <main>
        <h1>Toast</h1>
        <p>Bản xem trước độc lập bằng HTML/CSS; API <code>PVCComponent.toast</code> được export trong bundle.</p>
        <section class="panel">
            <button type="button" id="show-toast">Hiển thị thông báo 3 giây</button>
            <p><a href="index.html">Quay lại danh sách ví dụ</a></p>
        </section>
    </main>
    <div id="toast-preview" class="toast__container toast-infor" role="status" aria-live="polite">
        <div class="toast__noiDung">Đã lưu dữ liệu thành công.</div>
    </div>
    <script>
        const toast = document.querySelector('#toast-preview');
        let timeout;
        const hide = () => {
            toast.classList.remove('is-visible');
            window.clearTimeout(timeout);
        };
        document.querySelector('#show-toast').addEventListener('click', () => {
            window.clearTimeout(timeout);
            toast.classList.add('is-visible');
            timeout = window.setTimeout(hide, 3000);
        });
        toast.addEventListener('click', hide);
    </script>
</body>
</html>
